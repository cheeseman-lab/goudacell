[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goudacell"
version = "0.2.0"
description = "HPC-compatible cell segmentation using Cellpose"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Image I/O (tlambert03 packages)
    "nd2>=0.10.0",
    "mrc>=0.3.0",
    "tifffile>=2024.1.0",
    # OME-Zarr I/O
    "zarr>=3.1.0",
    "ome-zarr>=0.13.0",
    "dask[array]>=2024.1.0",
    "fsspec>=2024.1.0",
    # Core
    "numpy>=2.0.0",
    "scikit-image>=0.22.0",
    "scipy>=1.12.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Feature extraction (cp_emulator built-in)
    "mahotas>=1.4.13",  # Haralick, PFTAS, Zernike moments
    "decorator>=5.0.0",  # For @decorator in cp_emulator
    # Notebook
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "ipywidgets>=8.1.0",
    "ipykernel>=7.0.0",
    # Dev
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
# Cellpose 3.x - for cyto3, nuclei, cyto2 models (rounded cells)
cellpose3 = [
    "cellpose==3.1.0",
    # Pin torch to the cu126 wheel: the fry GPU driver (560.x) supports CUDA 12.6,
    # so an unpinned torch resolves to cu130 and torch.cuda.is_available() is False.
    "torch==2.7.0",
    "torchvision==0.22.0",
]
# Cellpose 4.x - for cpsam model only (requires GPU, better for complex shapes)
cellpose4 = [
    "cellpose==4.0.4",
    "torch==2.7.0",
    "torchvision==0.22.0",
]
# cp_measure - lightweight CellProfiler measurement extraction
cp_measure = [
    "cp-measure==0.1.12",
]
# CellProfiler headless - no Python deps needed, runs via CLI subprocess.
# Install CellProfiler in a separate conda env and provide the path:
#   cellprofiler_cmd: /path/to/cellprofiler-env/bin/cellprofiler

[project.scripts]
goudacell = "goudacell.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["goudacell"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]
"notebooks/*.py" = ["D100", "D103"]
"*.ipynb" = ["D100", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
